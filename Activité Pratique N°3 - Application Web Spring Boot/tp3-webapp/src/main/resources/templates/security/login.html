<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Connexion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="login-page d-flex align-items-center justify-content-center">
<div class="login-card">
        <div class="login-brand text-center">
            <div class="login-logo"><i class="bi bi-box-seam"></i></div>
            <h3>Bienvenue sur NovaStock</h3>
            <p class="mb-0 text-white-50">Votre inventaire, simplement maitrise.</p>
        </div>
        <div class="login-body">

            <!-- Message d'erreur -->
            <div th:if="${param.error}" class="alert alert-danger">
                <i class="bi bi-exclamation-triangle"></i> Identifiants incorrects.
            </div>

            <!-- Message de déconnexion -->
            <div th:if="${param.logout}" class="alert alert-success">
                <i class="bi bi-check-circle"></i> Vous avez été déconnecté.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Nom d'utilisateur</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control" placeholder="Entrez votre nom" required autofocus>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Mot de passe</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="Entrez votre mot de passe" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">
                    <i class="bi bi-box-arrow-in-right"></i> Se connecter
                </button>
            </form>

            <hr>
            <p class="text-muted small text-center mb-0">
                Comptes de test : <strong>admin/1234</strong> (ADMIN) &nbsp;|&nbsp; <strong>user1/1234</strong> (USER)
            </p>
        </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
