<main class="container page-wrap">
  <div class="page-head">
    <div><div class="eyebrow mb-2">Catalogue</div><h2 class="page-title mb-1">Tous les produits</h2><p class="text-muted mb-0">Consultez et organisez les produits disponibles.</p></div>
    <div class="d-flex gap-3 align-items-center"><div class="metric"><strong>{{ products.length }}</strong><span>produits au total</span></div><button class="refresh-btn" (click)="loadProducts()"><i class="bi bi-arrow-clockwise me-2"></i>Actualiser</button></div>
  </div>

  <div class="panel table-responsive"><table class="table modern-table align-middle">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nom</th>
        <th>Prix (DH)</th>
        <th>Statut</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let product of products" [class.table-active]="product.selected">
        <td>{{ product.id }}</td>
        <td><span class="product-icon"><i class="bi bi-box-seam"></i></span><strong>{{ product.name }}</strong></td>
        <td>{{ product.price | number:'1.2-2' }}</td>
        <td>
          <button class="border-0 bg-transparent" (click)="toggleSelected(product)"><span class="status" [class.status-on]="product.selected" [class.status-off]="!product.selected">{{ product.selected ? 'Actif' : 'Inactif' }}</span></button>
        </td>
        <td>
          <button class="icon-btn delete-btn" (click)="onDelete(product)">
            <i class="bi bi-trash"></i>
          </button>
        </td>
      </tr>
    </tbody>
  </table></div>

  <p *ngIf="products.length === 0" class="text-muted">Aucun produit disponible.</p>
</main>
